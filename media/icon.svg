<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- Marketplace icon: waveform + note on dark plate -->
  <rect width="128" height="128" rx="24" fill="#1B1F24"/>
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#252A31" stroke="#3A414C" stroke-width="2"/>
  <!-- waveform -->
  <path
    d="M22 72h8l8-28 12 48 12-64 10 36h14"
    stroke="#7DD3FC"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- note stem + head -->
  <rect x="92" y="28" width="7" height="48" rx="2" fill="#FBBF24"/>
  <ellipse cx="88" cy="78" rx="14" ry="10" fill="#FBBF24"/>
</svg>
